<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 440px;
      height: 280px;
      background: radial-gradient(circle at 70% 30%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    .glow {
      position: absolute;
      width: 250px;
      height: 250px;
      background: rgba(16, 185, 129, 0.15);
      filter: blur(60px);
      top: 15px;
      left: 95px;
      border-radius: 50%;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 12px;
      z-index: 10;
      letter-spacing: 0.5px;
    }
    .title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      z-index: 10;
    }
    .brand-icon { font-size: 32px; }
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, #e2e8f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tagline {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 18px;
      z-index: 10;
    }
    .pill-group {
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .pill {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(51, 65, 85, 0.8);
      font-size: 10.5px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      color: #f1f5f9;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="logo-badge">⚡ 2026 AMAZON FBA CALCULATOR</div>
  <div class="title-row">
    <span class="brand-icon">🎯</span>
    <span class="brand-title">SheetSniper</span>
  </div>
  <p class="tagline">Real-time Profit & 1-Click Google Sheets Sync</p>
  <div class="pill-group">
    <div class="pill">✓ 2026 Rates</div>
    <div class="pill">✓ 1-Click Sync</div>
    <div class="pill">✓ 100% Private</div>
  </div>
</body>
</html>
